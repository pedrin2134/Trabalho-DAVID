<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#407ecb;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .box{
      width:350px;
      background:white;
      padding:30px;
      border-radius:15px;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
    }

    .loggue{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#16a34a;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

    .loggue:hover{
      background:#15803d;
    }

    p{
      text-align:center;
      margin-top:15px;
    }

    a{
      color:#2563eb;
      text-decoration:none;
    }

  </style>
</head>
<body>

  <div class="box">

    <h1>Cadastro</h1>

    <input type="text" id="nome" placeholder="Seu nome">

    <input type="email" id="email" placeholder="Seu email">

    <input type="password" id="senha" placeholder="Sua senha">

    <a class="loggue" href="Sistema de presença.html">Cadastre-se</a>

    <p>
      Já possui conta?
      <a  href="login.html">Fazer login</a>
    </p>

  </div>

</body>
</html>
