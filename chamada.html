<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamada Escolar</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:linear-gradient(135deg, #0f172a, #0f172a);
    }

    .container{
        background:white;
        padding:40px;
        border-radius:15px;
        text-align:center;
        box-shadow:0 4px 15px rgba(0,0,0,0.2);
        width:350px;
    }

    .icone{
        font-size:70px;
        color:#4CAF50;
        margin-bottom:15px;
    }

    h1{
        color:#333;
        margin-bottom:10px;
    }

    p{
        color:#666;
        margin-bottom:25px;
    }

    a{
        background:#f44336;
        color:white;
        border:none;
        padding:12px 25px;
        border-radius:8px;
        cursor:pointer;
        font-size:16px;
        transition:0.3s;
        text-decoration: none;
    }

    a:hover{
        background:#d32f2f;
    }
</style>
</head>
<body>

<div class="container">
    <div class="icone">✔</div>

    <h1>Chamada Realizada!</h1>

    <p>A presença dos alunos foi registrada com sucesso.</p>

    <a href="login.html">sair</a>
</div>
</body>
