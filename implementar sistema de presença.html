<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Presença Escolar</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body{
    background:#0f172a;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

/* APP CONTAINER */
.app{
    width:100%;
    max-width:1000px;
    background:#ffffff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.4);
}

/* HEADER */
.header{
    background:linear-gradient(135deg,#1e3a8a,#2563eb);
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    font-size:20px;
}

.header span{
    font-size:13px;
    opacity:0.9;
}

/* MENU SIMULADO */
.menu{
    display:flex;
    gap:10px;
}

.menu div{
    background:rgba(255,255,255,0.15);
    padding:6px 12px;
    border-radius:8px;
    font-size:13px;
}

/* CONTEÚDO */
.content{
    padding:20px;
}

/* TABELA */
table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    overflow:hidden;
    border-radius:12px;
}

/* CABEÇALHO */
thead th{
    background:#0f172a;
    color:white;
    padding:14px;
    text-transform:uppercase;
    font-size:13px;
    letter-spacing:1px;
}

/* LINHAS */
tbody tr{
    transition:0.2s;
}

tbody tr:hover{
    background:#f1f5f9;
}

/* CELULAS */
td{
    padding:14px;
    border-bottom:1px solid #e2e8f0;
    text-align:center;
    font-size:14px;
}

/* ALTERNAR LINHAS */
tbody tr:nth-child(even){
    background:#f8fafc;
}

/* CHECKBOX */
input{
    display:none;
}

label{
    display:inline-block;
    width:24px;
    height:24px;
    border:2px solid #2563eb;
    border-radius:6px;
    cursor:pointer;
    transition:0.2s;
    position:relative;
}

/* CHECK MARCADO */
input:checked + label{
    background:#22c55e;
    border-color:#22c55e;
    transform:scale(1.05);
}

input:checked + label::after{
    content:"✔";
    position:absolute;
    color:white;
    font-size:14px;
    left:4px;
    top:0;
}

/* STATUS BONITO */
.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

/* cores de status */
.presente{
    background:#dcfce7;
    color:#166534;
}

.falta{
    background:#fee2e2;
    color:#991b1b;
}

/* FOOTER INFO */
.footer{
    padding:12px;
    text-align:center;
    font-size:13px;
    color:#64748b;
    border-top:1px solid #e2e8f0;
}
a{
    width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-decoration: none;
}
</style>

</head>
<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">
        <div>
            <h1>📋 Portal de Presença Escolar</h1>
            <span>Sistema de controle de alunos</span>
        </div>

        <div class="menu">
            <div>Turma 9A</div>
            <div>Hoje</div>
            <div>2026</div>
        </div>
    </div>

    <!-- CONTEÚDO -->
    <div class="content">

        <table>
            <thead>
                <tr>
                    <th>Aluno</th>
                    <th>Matrícula</th>
                    <th>Presença</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>João Silva</td>
                    <td>20245103</td>
                    <td>
                        <input type="checkbox" id="a1">
                        <label for="a1"></label>
                    </td>
                    <td><span class="status presente">Presente</span></td>
                </tr>

                <tr>
                    <td>Maria Souza</td>
                    <td>20248721</td>
                    <td>
                        <input type="checkbox" id="a2">
                        <label for="a2"></label>
                    </td>
                    <td><span class="status falta">Faltou</span></td>
                </tr>

                <tr>
                    <td>Pedro Lima</td>
                    <td>20243290</td>
                    <td>
                        <input type="checkbox" id="a3">
                        <label for="a3"></label>
                    </td>
                    <td><span class="status presente">Presente</span></td>
                </tr>

                <tr>
                    <td>Ana Clara</td>
                    <td>20249911</td>
                    <td>
                        <input type="checkbox" id="a4">
                        <label for="a4"></label>
                    </td>
                    <td><span class="status falta">Faltou</span></td>
                </tr>

                <tr>
                    <td>Lucas Rocha</td>
                    <td>20241277</td>
                    <td>
                        <input type="checkbox" id="a5">
                        <label for="a5"></label>
                    </td>
                    <td><span class="status presente">Presente</span></td>
                </tr>

                <tr>
                    <td>Beatriz Alves</td>
                    <td>20247654</td>
                    <td>
                        <input type="checkbox" id="a6">
                        <label for="a6"></label>
                    </td>
                    <td><span class="status falta">Faltou</span></td>
                </tr>

            </tbody>
        </table>

    </div>

    <div class="footer">
       <a href="chamada.html">Registrar</a>
        
    </div>

</div>

</body>
</html>
